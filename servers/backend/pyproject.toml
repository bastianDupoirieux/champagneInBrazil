[project]
name = "champagneInBrazil-backend"
version = "0.1.0"
description = "Backend of the cellar management app champagneInBrazil"
readme = "README.md"
authors = [{ name = "Bastian Dupoirieux" }]
requires-python = ">= 3.11"
dependencies = [
    "fastapi>=0.127.0",
    "pydantic>=2.12.5",
    "SQLAlchemy>=2.0.43",
    "sqlmodel>=0.0.29",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
]

[dependency-groups]
dev = ["poethepoet"]

[tool.uv]
package = false
